<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智慧投屏 - 黑板端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
    #video {
      width: 100vw; height: 100vh; object-fit: contain;
      background: #000; display: block;
    }
    /* 顶部状态条,鼠标移动时显示,几秒不动自动隐藏 */
    #bar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 16px;
      background: rgba(0,0,0,0.6); color: #fff;
      display: flex; align-items: center; gap: 12px;
      font-size: 14px; transition: opacity 0.3s;
    }
    #bar.hide { opacity: 0; pointer-events: none; }
    #status { flex: 1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
    .dot.ok { background: #4caf50; }
    .dot.err { background: #f44336; }
    .dot.wait { background: #ff9800; }
    button {
      background: #2196f3; color: #fff; border: 0;
      padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #1976d2; }
    /* 等待画面 */
    #waiting {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #888; gap: 16px;
    }
    #waiting.hide { display: none; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #333; border-top-color: #2196f3;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .room-tag { font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>

  <div id="waiting">
    <div class="spinner"></div>
    <div id="waitText">正在连接信令服务器…</div>
    <div class="room-tag" id="roomTag"></div>
  </div>

  <div id="bar">
    <span class="dot wait" id="dot"></span>
    <span id="status">连接中…</span>
    <button id="fullBtn">全屏</button>
  </div>

  <script>
    // 房间号:与 exe 默认一致,学生无感;URL 可覆盖
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || "default";
    document.getElementById("roomTag").textContent = "等待学生/老师投屏";
    document.title = "智慧投屏";

    const video = document.getElementById("video");
    const dot = document.getElementById("dot");
    const statusEl = document.getElementById("status");
    const waiting = document.getElementById("waiting");
    const waitText = document.getElementById("waitText");
    const bar = document.getElementById("bar");

    function setStatus(text, kind) {
      statusEl.textContent = text;
      dot.className = "dot " + (kind || "");
    }

    // 启动时拉一下黑板名(可选)
    fetch("/api/info").then(r => r.json()).then(info => {
      if (info && info.name) {
        document.title = "智慧投屏 - " + info.name;
        document.getElementById("roomTag").textContent = info.name + " · 等待投屏";
      }
    }).catch(() => {});

    // WebSocket 连本机信令
    const wsUrl = "ws://" + location.host + "/ws?room=" + encodeURIComponent(room) + "&role=browser";
    let ws;
    function connectWs() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        setStatus("已就绪,等待 pad 投屏…", "wait");
        waitText.textContent = "等待 pad 投屏…";
      };
      ws.onclose = () => {
        setStatus("与信令断开,3 秒后重连", "err");
        setTimeout(connectWs, 3000);
      };
      ws.onerror = () => setStatus("连接出错", "err");
      ws.onmessage = onMessage;
    }

    // WebRTC
    // 注意:pad 端 addTrack 若不带 streamId,e.streams 会是空数组,
    // 这时必须用 e.track 自己包一个 MediaStream,否则 video 永远黑屏
    let pc = null;
    let pendingIce = [];

    function ensurePc() {
      if (pc) return pc;
      pc = new RTCPeerConnection();
      pendingIce = [];

      pc.ontrack = (e) => {
        console.log("[webrtc] ontrack", {
          kind: e.track?.kind,
          streams: e.streams?.length || 0,
          trackId: e.track?.id,
          readyState: e.track?.readyState
        });
        // 优先用 stream;没有 stream 就用 track 自建(兼容 a=msid:- xxx)
        if (e.streams && e.streams[0]) {
          video.srcObject = e.streams[0];
        } else if (e.track) {
          video.srcObject = new MediaStream([e.track]);
        }
        // 显式 play,部分浏览器 autoplay 即使 muted 也不自动播
        video.play().catch((err) => console.warn("[webrtc] play failed", err));
        waiting.classList.add("hide");
        setStatus("投屏中", "ok");

        // 诊断:几秒后看有没有真正出帧 + 简单码率/帧率
        setTimeout(async () => {
          console.log("[webrtc] video state", {
            w: video.videoWidth,
            h: video.videoHeight,
            paused: video.paused,
            currentTime: video.currentTime,
            readyState: video.readyState
          });
          if (video.videoWidth === 0) {
            setStatus("已连接但无画面(解码/绑定异常)", "err");
            return;
          }
          setStatus("投屏中 " + video.videoWidth + "x" + video.videoHeight, "ok");
          try {
            const stats = await pc.getStats();
            let inbound = null;
            stats.forEach((r) => {
              if (r.type === "inbound-rtp" && r.kind === "video") inbound = r;
            });
            if (inbound) {
              console.log("[webrtc] inbound-rtp", {
                mimeType: inbound.mimeType,
                framesPerSecond: inbound.framesPerSecond,
                framesDecoded: inbound.framesDecoded,
                bytesReceived: inbound.bytesReceived,
                packetsLost: inbound.packetsLost
              });
            }
          } catch (_) {}
        }, 2500);

        // 持续刷新分辨率/码率/codec;丢包或解码停滞时请求关键帧(PLI)
        if (window.__statsTimer) clearInterval(window.__statsTimer);
        window.__lastBytes = null;
        window.__lastFramesDecoded = null;
        window.__lastPliAt = 0;
        window.__statsTimer = setInterval(async () => {
          if (!pc || pc.iceConnectionState === "closed") {
            clearInterval(window.__statsTimer);
            return;
          }
          try {
            const stats = await pc.getStats();
            let inbound = null;
            stats.forEach((r) => {
              if (r.type === "inbound-rtp" && (r.kind === "video" || r.mediaType === "video")) {
                inbound = r;
              }
            });
            if (inbound && video.videoWidth) {
              const fps = inbound.framesPerSecond != null
                ? Math.round(inbound.framesPerSecond)
                : "-";
              const kbps = inbound.bytesReceived != null && window.__lastBytes != null
                ? Math.round((inbound.bytesReceived - window.__lastBytes) * 8 / 5 / 1000)
                : "-";
              window.__lastBytes = inbound.bytesReceived;
              const codec = (inbound.mimeType || "").replace("video/", "") || "?";
              const lost = inbound.packetsLost != null ? inbound.packetsLost : 0;
              setStatus(
                "投屏中 " + video.videoWidth + "x" + video.videoHeight +
                " · " + codec + " · " + fps + "fps · " + kbps + "kbps",
                "ok"
              );

              // 解码停滞或明显丢包 → 请求关键帧(PLI)
              const decoded = inbound.framesDecoded || 0;
              const stalled = window.__lastFramesDecoded != null &&
                decoded === window.__lastFramesDecoded && video.videoWidth > 0;
              window.__lastFramesDecoded = decoded;
              const now = Date.now();
              if ((stalled || lost > (window.__lastLost || 0) + 20) &&
                  now - window.__lastPliAt > 2000) {
                window.__lastPliAt = now;
                try {
                  const receivers = pc.getReceivers ? pc.getReceivers() : [];
                  receivers.forEach((r) => {
                    if (r.track && r.track.kind === "video") {
                      // 部分浏览器支持
                      if (typeof r.requestKeyFrame === "function") {
                        r.requestKeyFrame();
                        console.log("[webrtc] requestKeyFrame (PLI)");
                      }
                    }
                  });
                } catch (e) {
                  console.warn("[webrtc] PLI failed", e);
                }
              }
              window.__lastLost = lost;
            }
          } catch (_) {}
        }, 5000);
      };

      pc.onicecandidate = (e) => {
        if (e.candidate) send({ type: "ice", data: e.candidate });
      };
      pc.oniceconnectionstatechange = () => {
        const s = pc.iceConnectionState;
        console.log("[webrtc] ice:", s);
        if (s === "failed") setStatus("连接异常:" + s, "err");
        else if (s === "disconnected") setStatus("连接中断,尝试恢复…", "wait");
        else if (s === "connected" || s === "completed") {
          if (video.videoWidth)
            setStatus("投屏中 " + video.videoWidth + "x" + video.videoHeight, "ok");
          else setStatus("投屏中", "ok");
        }
      };
      pc.onconnectionstatechange = () => {
        console.log("[webrtc] pc:", pc.connectionState);
      };
      return pc;
    }

    function resetPc() {
      if (window.__statsTimer) {
        clearInterval(window.__statsTimer);
        window.__statsTimer = null;
      }
      window.__lastBytes = null;
      if (pc) {
        try { pc.close(); } catch (_) {}
        pc = null;
      }
      pendingIce = [];
      video.srcObject = null;
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    async function onMessage(event) {
      const msg = JSON.parse(event.data);
      try {
        if (msg.type === "offer") {
          // 投屏场景:每次 offer 都新建 PC 最稳
          // (pad 重连/刷新都会带新 session,旧 PC 容易半残)
          resetPc();
          const conn = ensurePc();
          await conn.setRemoteDescription(msg.data);
          for (const c of pendingIce) {
            await conn.addIceCandidate(c).catch(() => {});
          }
          pendingIce = [];
          const answer = await conn.createAnswer();
          await conn.setLocalDescription(answer);
          send({ type: "answer", data: answer });
          waitText.textContent = "已收到 pad 请求,正在建立连接…";
          console.log("[webrtc] answer sent, codecs:",
            (answer.sdp || "").match(/a=rtpmap:\d+ \w+/g));
        } else if (msg.type === "ice") {
          // 过滤空 candidate / 异常字段
          if (!msg.data || (!msg.data.candidate && msg.data.candidate !== "")) {
            return;
          }
          if (!pc || !pc.remoteDescription) {
            pendingIce.push(msg.data);
          } else {
            await pc.addIceCandidate(msg.data).catch(() => {});
          }
        } else if (msg.type === "peer-left") {
          setStatus("pad 已断开,等待重新投屏…", "wait");
          waiting.classList.remove("hide");
          waitText.textContent = "pad 已断开,等待重新投屏…";
          resetPc();
        } else if (msg.type === "session-reset") {
          // 新 pad 顶替:立刻丢掉旧 PC/旧码流,避免两个 pad 画面串扰
          console.log("[webrtc] session-reset", msg.reason || "");
          resetPc();
          waiting.classList.remove("hide");
          waitText.textContent = "切换投屏设备中…";
          setStatus("切换投屏设备中…", "wait");
        } else if (msg.type === "joined") {
          if (msg.boardName) {
            document.title = "智慧投屏 - " + msg.boardName;
            document.getElementById("roomTag").textContent = msg.boardName + " · 等待投屏";
          }
          if (msg.peerOnline) {
            setStatus("pad 在线,等待画面…", "wait");
            waitText.textContent = "pad 在线,正在建立画面…";
          } else {
            setStatus("已就绪,等待 pad 投屏…", "wait");
            waitText.textContent = "等待 pad 投屏…";
          }
        } else if (msg.type === "peer-online") {
          // 新 pad 上线时也清一次,防止仍挂着上一路流
          if (pc) {
            console.log("[webrtc] peer-online → reset old pc");
            resetPc();
          }
          waiting.classList.remove("hide");
          setStatus("pad 已连接,等待画面…", "wait");
          waitText.textContent = "pad 已连接,正在建立画面…";
        }
      } catch (err) {
        console.error("[webrtc] 协商出错", err);
        setStatus("协商出错:" + err.message, "err");
        resetPc();
      }
    }

    // 全屏按钮
    document.getElementById("fullBtn").onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    };

    // 状态条自动隐藏(3 秒不动鼠标)
    let hideTimer;
    document.addEventListener("mousemove", () => {
      bar.classList.remove("hide");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => bar.classList.add("hide"), 3000);
    });

    connectWs();
  </script>
</body>
</html>
