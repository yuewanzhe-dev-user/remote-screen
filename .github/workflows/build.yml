name: 构建

# 触发:push 到 main,或网页手动 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '指定构建目标(all/pad/exe/webrtc/signaling),留空=全部'
        required: false
        default: 'all'

# 思路:用一个 detect-changes job 统一检测本次改动的目录,
# 后续每个 job 根据 detect-changes 的输出决定是否运行。
# 这样避免每个 job 重复手写 shell 脚本(之前 git diff 在浅克隆上报 exit 128)。

jobs:

  # ============ 第一步:检测改动落在哪些目录 ============
  detect-changes:
    name: 检测改动目录
    runs-on: ubuntu-latest
    outputs:
      pad: ${{ steps.f.outputs.pad }}
      exe: ${{ steps.f.outputs.exe }}
      webrtc: ${{ steps.f.outputs.webrtc }}
      signaling: ${{ steps.f.outputs.signaling }}
    steps:
      - uses: actions/checkout@v4

      - name: 用 paths-filter 检测改动目录
        id: f
        uses: dorny/paths-filter@v3
        with:
          # workflow 本身改动 → 所有都算改动(验证构建配置)
          filters: |
            pad:
              - 'sender-android/**'
              - '.github/workflows/**'
            exe:
              - 'receiver-windows/**'
              - '.github/workflows/**'
            webrtc:
              - 'webrtc-android/**'
              - '.github/workflows/**'
            signaling:
              - 'signaling-go/**'
              - '.github/workflows/**'

  # ============ TCP 方案:pad 端 APK ============
  build-pad:
    name: 构建 pad 端 APK (TCP)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.pad == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 下载 Gradle 8.5 并生成 Wrapper
        working-directory: sender-android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 编译 Debug APK
        working-directory: sender-android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 智慧投屏-pad端-apk
          path: sender-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ============ TCP 方案:黑板端 EXE ============
  build-exe:
    name: 构建黑板端 EXE (TCP)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.exe == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 交叉编译为 Windows EXE
        working-directory: receiver-windows/go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o 投屏接收端.exe main.go

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: 智慧投屏-黑板端-exe
          path: receiver-windows/go/投屏接收端.exe
          retention-days: 30

  # ============ WebRTC 方案:pad 端 APK ============
  build-webrtc-pad:
    name: 构建 pad 端 APK (WebRTC)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.webrtc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 webrtc-android 目录是否有内容
        id: exists
        run: |
          if [[ -d "webrtc-android" ]] && [[ -n "$(ls -A webrtc-android/ 2>/dev/null)" ]]; then
            echo "has=true" >> $GITHUB_OUTPUT
          else
            echo "has=false" >> $GITHUB_OUTPUT
            echo "webrtc-android 目录为空,跳过"
          fi

      - name: 安装 JDK 17
        if: steps.exists.outputs.has == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        if: steps.exists.outputs.has == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 下载 Gradle 8.5 并生成 Wrapper
        if: steps.exists.outputs.has == 'true'
        working-directory: webrtc-android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 编译 Debug APK
        if: steps.exists.outputs.has == 'true'
        working-directory: webrtc-android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        if: steps.exists.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 智慧投屏-pad端-WebRTC-apk
          path: webrtc-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ============ WebRTC 方案:信令服务器 EXE ============
  build-signaling:
    name: 构建信令服务器 EXE (WebRTC)
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.signaling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 main.go 是否存在
        id: exists
        run: |
          if [[ -f "signaling-go/main.go" ]]; then
            echo "has=true" >> $GITHUB_OUTPUT
          else
            echo "has=false" >> $GITHUB_OUTPUT
            echo "signaling-go/main.go 不存在,跳过"
          fi

      - name: 安装 Go
        if: steps.exists.outputs.has == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # go-webview2 无正式 tag:使用 go.mod 中的伪版本 + 已提交 go.sum
      # 不在 CI 里 go get 假 tag,避免 unknown revision
      - name: 下载依赖
        if: steps.exists.outputs.has == 'true'
        working-directory: signaling-go
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go mod download

      # go-webview2 为纯 Go + Win32,交叉编译 CGO_ENABLED=0 即可
      - name: 交叉编译为 Windows EXE (内嵌 HTML + WebView2)
        if: steps.exists.outputs.has == 'true'
        working-directory: signaling-go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          GOPROXY: https://proxy.golang.org,direct
        run: go build -ldflags="-s -w" -o 智慧投屏-黑板.exe .

      - name: 上传 EXE
        if: steps.exists.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 智慧投屏-黑板端-WebRTC-exe
          path: signaling-go/智慧投屏-黑板.exe
          retention-days: 30
