name: 构建

# 触发:push 到 main,或网页手动 Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: '指定构建目标(all/pad/exe/webrtc/signaling),留空=全部'
        required: false
        default: 'all'

# 每个 job 内部判断:本次改动是否落在自己的目录范围
# 改动文件列表直接读 github.event.head_commit(无需 git diff,零成本)
# workflow 本身(.github/workflows/)改动 → 所有 job 都构建
# workflow_dispatch 手动触发 → 用 inputs.target 控制

jobs:

  # ============ TCP 方案:pad 端 APK ============
  build-pad:
    name: 构建 pad 端 APK (TCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否需要构建
        id: check
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set +e
          # 手动触发:按 target 参数决定
          if [[ -n "$TARGET" ]]; then
            if [[ "$TARGET" == "all" || "$TARGET" == "pad" ]]; then
              echo "skip=false" >> $GITHUB_OUTPUT; echo "手动触发,构建 pad"
            else
              echo "skip=true" >> $GITHUB_OUTPUT; echo "target=$TARGET,跳过 pad"
            fi
            exit 0
          fi
          # push 触发:读本次改动文件列表(GitHub 直接提供,不用 git diff)
          FILES_JSON='${{ toJSON(github.event.head_commit.modified) }}${{ toJSON(github.event.head_commit.added) }}${{ toJSON(github.event.head_commit.removed) }}'
          if echo "$FILES_JSON" | grep -qE '(sender-android/|workflows/)'; then
            echo "skip=false" >> $GITHUB_OUTPUT; echo "检测到 pad 端改动,构建"
          else
            echo "skip=true" >> $GITHUB_OUTPUT; echo "本次未改动 pad 端,跳过"
          fi

      - name: 安装 JDK 17
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        if: steps.check.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 下载 Gradle 8.5 并生成 Wrapper
        if: steps.check.outputs.skip != 'true'
        working-directory: sender-android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 编译 Debug APK
        if: steps.check.outputs.skip != 'true'
        working-directory: sender-android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 智慧投屏-pad端-apk
          path: sender-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ============ TCP 方案:黑板端 EXE ============
  build-exe:
    name: 构建黑板端 EXE (TCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否需要构建
        id: check
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set +e
          if [[ -n "$TARGET" ]]; then
            if [[ "$TARGET" == "all" || "$TARGET" == "exe" ]]; then
              echo "skip=false" >> $GITHUB_OUTPUT; echo "手动触发,构建 exe"
            else
              echo "skip=true" >> $GITHUB_OUTPUT; echo "target=$TARGET,跳过 exe"
            fi
            exit 0
          fi
          FILES_JSON='${{ toJSON(github.event.head_commit.modified) }}${{ toJSON(github.event.head_commit.added) }}${{ toJSON(github.event.head_commit.removed) }}'
          if echo "$FILES_JSON" | grep -qE '(receiver-windows/|workflows/)'; then
            echo "skip=false" >> $GITHUB_OUTPUT; echo "检测到黑板端改动,构建"
          else
            echo "skip=true" >> $GITHUB_OUTPUT; echo "本次未改动黑板端,跳过"
          fi

      - name: 安装 Go
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 交叉编译为 Windows EXE
        if: steps.check.outputs.skip != 'true'
        working-directory: receiver-windows/go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o 投屏接收端.exe main.go

      - name: 上传 EXE
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 智慧投屏-黑板端-exe
          path: receiver-windows/go/投屏接收端.exe
          retention-days: 30

  # ============ WebRTC 方案:pad 端 APK ============
  build-webrtc-pad:
    name: 构建 pad 端 APK (WebRTC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否需要构建
        id: check
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set +e
          # webrtc-android 目录还没建,先检查存在性
          if [[ ! -d "webrtc-android" ]] || [[ -z "$(ls -A webrtc-android/ 2>/dev/null)" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT; echo "webrtc-android 目录为空,跳过"
            exit 0
          fi
          if [[ -n "$TARGET" ]]; then
            if [[ "$TARGET" == "all" || "$TARGET" == "webrtc" ]]; then
              echo "skip=false" >> $GITHUB_OUTPUT; echo "手动触发,构建 WebRTC pad"
            else
              echo "skip=true" >> $GITHUB_OUTPUT; echo "target=$TARGET,跳过 WebRTC pad"
            fi
            exit 0
          fi
          FILES_JSON='${{ toJSON(github.event.head_commit.modified) }}${{ toJSON(github.event.head_commit.added) }}${{ toJSON(github.event.head_commit.removed) }}'
          if echo "$FILES_JSON" | grep -qE '(webrtc-android/|workflows/)'; then
            echo "skip=false" >> $GITHUB_OUTPUT; echo "检测到 WebRTC pad 端改动,构建"
          else
            echo "skip=true" >> $GITHUB_OUTPUT; echo "本次未改动 WebRTC pad 端,跳过"
          fi

      - name: 安装 JDK 17
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        if: steps.check.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 下载 Gradle 8.5 并生成 Wrapper
        if: steps.check.outputs.skip != 'true'
        working-directory: webrtc-android
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 编译 Debug APK
        if: steps.check.outputs.skip != 'true'
        working-directory: webrtc-android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 智慧投屏-WebRTC版-apk
          path: webrtc-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ============ WebRTC 方案:信令服务器 EXE ============
  build-signaling:
    name: 构建信令服务器 EXE (WebRTC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否需要构建
        id: check
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set +e
          FILES_JSON='${{ toJSON(github.event.head_commit.modified) }}${{ toJSON(github.event.head_commit.added) }}${{ toJSON(github.event.head_commit.removed) }}'
          # 手动触发 + 目录有内容,直接构建
          if [[ -n "$TARGET" ]]; then
            if [[ "$TARGET" == "all" || "$TARGET" == "signaling" ]]; then
              echo "skip=false" >> $GITHUB_OUTPUT; echo "手动触发,构建信令服务器"
            else
              echo "skip=true" >> $GITHUB_OUTPUT; echo "target=$TARGET,跳过信令服务器"
            fi
            exit 0
          fi
          # push:signaling-go 还没写 main.go,先检查
          if [[ ! -f "signaling-go/main.go" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT; echo "signaling-go/main.go 不存在,跳过"
            exit 0
          fi
          if echo "$FILES_JSON" | grep -qE '(signaling-go/|workflows/)'; then
            echo "skip=false" >> $GITHUB_OUTPUT; echo "检测到信令服务器改动,构建"
          else
            echo "skip=true" >> $GITHUB_OUTPUT; echo "本次未改动信令服务器,跳过"
          fi

      - name: 安装 Go
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 下载依赖
        if: steps.check.outputs.skip != 'true'
        working-directory: signaling-go
        run: go mod download

      - name: 交叉编译为 Windows EXE (内嵌 HTML)
        if: steps.check.outputs.skip != 'true'
        working-directory: signaling-go
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o 信令服务器.exe main.go

      - name: 上传 EXE
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 智慧投屏-信令服务器-exe
          path: signaling-go/信令服务器.exe
          retention-days: 30
